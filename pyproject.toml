[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stai", "chapters"]

[project]
name = "systems-thinking-with-ai"
version = "0.1.0a1"
description = "A companion repository for teaching systems modeling with AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "PyYAML>=6.0",
]

[project.scripts]
stai = "stai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
figures = [
    "matplotlib>=3.9",
    "numpy>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = ["network: needs internet access; excluded by default"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
