name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --group figures
      - run: uv run --group figures ruff check .
      - run: uv run --group figures pytest
      - run: uv run python scripts/validate_skills.py
      - run: uv run python scripts/fetch_data.py --verify
      - run: uv run python -m examples.reviewed_workflow
